function showStudentDetail(name){
  if(cu.type!=='teacher') return;
  const st=state.students[name];
  if(!st) return;
  const p=calcP(name);
  const pos=p.tpnl>=0;
  const emoji=stuEmoji(name);
  const hasPw=(state.passwords||{})[name]?'🔐':'🔓';
  const adeps=(st.deps||[]).filter(d=>!d.done&&!d.er);
  const myTx=(state.txLog||[]).filter(t=>t.name===name).slice(0,10);
  const myPatrol=(state.patrolLog||[]).filter(l=>l.target===name).slice(0,5);
  const patrolScore=myPatrol.reduce((a,l)=>a+l.score,0);

  let body=`
  <div style="text-align:center;margin-bottom:.75rem;">
    <div style="font-size:3rem;">${emoji}</div>
    <div style="font-weight:700;font-size:1.05rem;">${name} ${hasPw}</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.75rem;">
    <div style="background:var(--g50);border-radius:8px;padding:.5rem;text-align:center;">
      <div class="txs tg">총 자산</div><div class="tsm fb tp">${fE(p.total)}</div>
    </div>
    <div style="background:var(--g50);border-radius:8px;padding:.5rem;text-align:center;">
      <div class="txs tg">투자 가능</div><div class="tsm fb">${fE2(st.bal)}</div>
    </div>
    <div style="background:${pos?'var(--sl)':'var(--dl)'};border-radius:8px;padding:.5rem;text-align:center;">
      <div class="txs tg">총 손익</div><div class="tsm fb ${pos?'tsuc':'tdan'}">${pos?'+':''}${fE2(p.tpnl)}</div>
    </div>
    <div style="background:${pos?'var(--sl)':'var(--dl)'};border-radius:8px;padding:.5rem;text-align:center;">
      <div class="txs tg">수익률</div><div class="tsm fb ${pos?'tsuc':'tdan'}">${pos?'+':''}${p.tpct.toFixed(1)}%</div>
    </div>
  </div>`;

  // 보유 주식
  const holdings=STOCKS.filter(s=>(st.hld[s.id]||0)>0);
  if(holdings.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin-bottom:.35rem;color:var(--g700);">📊 보유 주식</div>`;
    holdings.forEach(s=>{
      const q=st.hld[s.id],cp=state.stocks[s.id].price,ac=st.cb[s.id]||0;
      const pnl=(cp-ac)*q;
      body+=`<div style="display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--g200);font-size:.78rem;">
        <span>${s.emoji} ${s.name.replace('DAIZE ','')} ${q}주</span>
        <span class="${pnl>=0?'tsuc':'tdan'} fb">${pnl>=0?'+':''}${fE2(pnl)}</span>
      </div>`;
    });
  }

  // 예금
  if(adeps.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.55rem 0 .35rem;color:var(--g700);">🏦 예금 ${adeps.length}건</div>`;
    adeps.forEach(d=>{
      body+=`<div style="font-size:.75rem;padding:.25rem 0;border-bottom:1px solid var(--g200);">${d.mon}개월 · ${fE(d.amt)} · D-${daysLeft(d.md)}</div>`;
    });
  }

  // 순찰 요약
  if(myPatrol.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.55rem 0 .35rem;color:var(--g700);">🚔 순찰 기록 (합산: <span class="${patrolScore>=0?'tsuc':'tdan'}">${patrolScore>=0?'+':''}${patrolScore}</span>)</div>`;
    myPatrol.forEach(l=>{
      body+=`<div style="font-size:.75rem;padding:.2rem 0;border-bottom:1px solid var(--g200);">
        ${l.date.slice(5)} · ${escHtml(l.content)} · <span class="${l.score>=0?'tsuc':'tdan'}">${l.score>=0?'+':''}${l.score}</span>
      </div>`;
    });
  }

  // 최근 거래
  if(myTx.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.55rem 0 .35rem;color:var(--g700);">📋 최근 거래 ${myTx.length}건</div>`;
    myTx.forEach(tx=>{
      body+=`<div style="font-size:.75rem;padding:.2rem 0;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;">
        <span>${tx.date} · ${escHtml(tx.note||tx.type)}</span>
        <span class="fb">${fE(tx.amt)}</span>
      </div>`;
    });
  }

  // 이모지 보관함
  const icons=Object.keys(st.iconMap||{});
  if(icons.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.55rem 0 .35rem;color:var(--g700);">🎨 이모지 ${icons.length}개</div>
    <div style="display:flex;flex-wrap:wrap;gap:.25rem;">${icons.map(e=>`<span style="font-size:1.4rem;">${e}</span>`).join('')}</div>`;
  }

  openModal(`${emoji} ${name} 상세 정보`,body,[{l:'닫기',c:'bs',f:closeModal}]);
}

// ── DARK MODE
function toggleDarkMode(){
  const html=document.documentElement;
  const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'':'dark');
  const btn=document.getElementById('darkToggle');
  if(btn) btn.textContent=isDark?'🌙':'☀️';
  try{localStorage.setItem('daize-theme',isDark?'':'dark');}catch(e){}
}

// ── TX HISTORY (거래 내역 — 학생용)
function rTxHistory(el){
  const st=state.students[cu.name];
  const myTx=(state.txLog||[]).filter(t=>t.name===cu.name);

  // 주식 보유 현황 카드
  let h=`<div class="card"><div class="ct">📊 보유 주식 현황</div>`;
  let hasTrade=false;
  STOCKS.forEach(s=>{
    const q=st.hld[s.id]||0, ac=st.cb[s.id]||0;
    if(q>0){
      hasTrade=true;
      const val=q*state.stocks[s.id].price;
      const cost=q*ac;
      const pnl=val-cost;
      const pct=cost>0?(pnl/cost*100):0;
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:.6rem;border-radius:10px;background:var(--g50);margin-bottom:.4rem;">
        <div style="display:flex;align-items:center;gap:.55rem;">
          <span style="font-size:1.5rem;">${s.emoji}</span>
          <div>
            <div style="font-weight:600;font-size:.88rem;">${s.name}</div>
            <div class="txs tg">${q}주 · 평단 ${fE2(ac)}</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;font-size:.9rem;">${fE2(val)}</div>
          <div style="font-size:.78rem;font-weight:600;color:${pnl>=0?'var(--suc)':'var(--dan)'};">${pnl>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% (${pnl>=0?'+':''}${fE2(pnl)})</div>
        </div>
      </div>`;
    }
  });
  if(!hasTrade) h+=`<div class="empty">보유 주식이 없습니다.</div>`;
  h+=`</div>`;

  // 거래 기록 카드
  h+=`<div class="card"><div class="ct">📋 거래 내역 ${myTx.length>0?`<span class="txs tg" style="font-weight:400;">(${myTx.length}건)</span>`:''}</div>`;
  if(!myTx.length){
    h+=`<div class="empty">아직 거래 기록이 없습니다.</div>`;
  } else {
    myTx.slice(0,50).forEach(tx=>{
      const isIn=tx.type==='deposit';
      const note=tx.note||'';
      const isTrade=note.includes('매수')||note.includes('매도');
      const icon=isTrade?(note.includes('매수')?'📈':'📉'):(isIn?'📥':'📤');
      const label=isTrade?(note.includes('매수')?'주식 매수':'주식 매도'):(isIn?'입금':'출금');
      h+=`<div style="display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid var(--g200);">
        <span style="font-size:1.2rem;">${icon}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:.82rem;color:${isIn?'var(--suc)':'var(--dan)'};">${label}</div>
          <div class="txs tg" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(note)||tx.date}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;font-size:.85rem;color:${isIn?'var(--suc)':'var(--dan)'};">${isIn?'+':'−'}${fE(tx.amt)}</div>
          <div class="txs tg">${tx.date}</div>
        </div>
      </div>`;
    });
    if(myTx.length>50) h+=`<div class="txs tg" style="text-align:center;padding:.5rem;">최근 50건만 표시</div>`;
  }
  h+=`</div>`;
  el.innerHTML=h;
}

// ── MODAL / TOAST
function openModal(title,body,acts){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=body;
  const ae=document.getElementById('mActs');ae.innerHTML='';
  acts.forEach(a=>{const b=document.createElement('button');b.className=`btn ${a.c}`;b.textContent=a.l;b.style.flex='1';b.onclick=a.f;ae.appendChild(b);});
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
