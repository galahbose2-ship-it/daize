<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAIZE 학급 운영 시스템</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');
  :root{
    --primary:#1a56db;--pl:#e8f0fe;--suc:#0e9f6e;--sl:#def7ec;
    --dan:#e02424;--dl:#fde8e8;--warn:#c27803;--wl:#fdf6b2;
    --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;
    --success-light:#def7ec;--danger-light:#fde8e8;
    --r:12px;--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
    --bg:#f0f4f8;--card:white;--card-border:var(--g200);
  }
  [data-theme="dark"]{
    --primary:#60a5fa;--pl:#1e3a5f;--suc:#34d399;--sl:#064e3b;
    --dan:#f87171;--dl:#450a0a;--warn:#fbbf24;--wl:#422006;
    --g50:#1a1a2e;--g100:#1f2937;--g200:#374151;--g300:#4b5563;--g400:#6b7280;--g500:#9ca3af;--g600:#d1d5db;--g700:#e5e7eb;--g800:#f3f4f6;--g900:#f9fafb;
    --success-light:#064e3b;--danger-light:#450a0a;
    --sh:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --bg:#0f172a;--card:#1e293b;--card-border:#334155;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--g900);min-height:100vh;font-size:15px;transition:background .3s,color .3s;}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
  .lcard{background:var(--card);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:440px;box-shadow:0 4px 6px rgba(0,0,0,.07);}
  .llogo{text-align:center;margin-bottom:2rem;}
  .llogo h1{font-family:'Space Grotesk',sans-serif;font-size:2rem;color:var(--primary);}
  .llogo p{color:var(--g500);font-size:.9rem;margin-top:.2rem;}
  .fg{margin-bottom:.9rem;}
  .fg label{display:block;font-size:.85rem;font-weight:500;color:var(--g700);margin-bottom:.35rem;}
  .fg select,.fg input{width:100%;padding:.65rem .9rem;border:1.5px solid var(--g200);border-radius:10px;font-size:1rem;font-family:inherit;outline:none;transition:border-color .2s;background:var(--card);color:var(--g900);}
  .fg select:focus,.fg input:focus{border-color:var(--primary);}
  /* 학생 이름 선택 그리드 */
  .student-grid-sel{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-bottom:.9rem;}
  .stu-btn{padding:.6rem .3rem;border:1.5px solid var(--g200);border-radius:10px;background:var(--g50);font-size:.88rem;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;color:var(--g700);line-height:1.5;}
  .stu-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--pl);}
  .stu-btn.selected{border-color:var(--primary);background:var(--primary);color:white;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:.62rem 1rem;border-radius:10px;border:none;font-size:.92rem;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;}
  .bp{background:var(--primary);color:white;}.bp:hover{opacity:.9;}
  .bs{background:var(--g100);color:var(--g700);}.bs:hover{background:var(--g200);}
  .bsuc{background:var(--suc);color:white;}.bsuc:hover{opacity:.9;}
  .bdan{background:var(--dan);color:white;}.bdan:hover{opacity:.9;}
  .bsm{padding:.35rem .75rem;font-size:.82rem;}
  .bfull{width:100%;}
  #appScreen{display:none;min-height:100vh;flex-direction:column;}
  .topbar{background:var(--card);border-bottom:1px solid var(--card-border);padding:0 1.4rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .tlogo{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--primary);}
  /* 상단 탭 - 데스크탑 */
  .nav-tabs{display:none;background:var(--card);border-bottom:1px solid var(--card-border);padding:0 .8rem;overflow-x:auto;scrollbar-width:none;}
  .nav-tabs::-webkit-scrollbar{display:none;}
  .nt{padding:.7rem 1rem;font-size:.85rem;font-weight:500;color:var(--g500);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;}
  .nt.active{color:var(--primary);border-bottom-color:var(--primary);}
  .nt:hover:not(.active){color:var(--g700);}
  /* 하단 탭 바 */
  .bottom-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card-border);z-index:100;padding:0;padding-bottom:env(safe-area-inset-bottom,0);}
  .bt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.45rem 0 .35rem;font-size:.62rem;font-weight:500;color:var(--g400);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;border:none;background:none;gap:.12rem;position:relative;}
  .bt.active{color:var(--primary);}
  .bt.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2.5px;background:var(--primary);border-radius:0 0 4px 4px;}
  .bt-icon{font-size:1.15rem;line-height:1;}
  .bt-label{line-height:1;}
  .mc{padding:1.1rem;padding-bottom:5rem;max-width:860px;margin:0 auto;width:100%;}
  .tc{display:none;}.tc.active{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes treeShake{0%,100%{transform:rotate(0);}15%{transform:rotate(-6deg);}30%{transform:rotate(5deg);}45%{transform:rotate(-4deg);}60%{transform:rotate(3deg);}75%{transform:rotate(-1deg);}}
  .tree-shake{animation:treeShake .8s ease;}
  .card{background:var(--card);border-radius:var(--r);padding:1.2rem;box-shadow:var(--sh);margin-bottom:.9rem;}
  .ct{font-size:.97rem;font-weight:700;color:var(--g900);margin-bottom:.9rem;display:flex;align-items:center;gap:.4rem;}
  .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.9rem;}
  .si{background:var(--g50);border-radius:10px;padding:.85rem;text-align:center;}
  .sl{font-size:.75rem;color:var(--g500);margin-bottom:.2rem;}
  .sv{font-size:1.05rem;font-weight:700;}
  /* PnL Banner */
  .pb{border-radius:12px;padding:.9rem 1rem;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;}
  .pb.pos{background:var(--sl);border:1.5px solid var(--suc);}
  .pb.neg{background:var(--dl);border:1.5px solid var(--dan);}
  .pb.neu{background:var(--g50);border:1.5px solid var(--g200);}
  .pb-label{font-size:.82rem;color:var(--g700);margin-bottom:.12rem;}
  .pb-amt{font-size:1.3rem;font-weight:700;}
  .pb-pct{font-size:.83rem;font-weight:600;margin-top:.08rem;}
  /* Stock card */
  .sc{border:1.5px solid var(--g200);border-radius:var(--r);padding:.9rem;margin-bottom:.65rem;}
  .sch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.6rem;}
  .scn{font-weight:700;font-size:.97rem;}
  .scp{text-align:right;}
  .scpv{font-size:1.1rem;font-weight:700;}
  .bdg{display:inline-block;padding:.16rem .55rem;border-radius:6px;font-size:.74rem;font-weight:500;}
  .bsemi{background:#dbeafe;color:var(--primary);}.bfood{background:#dcfce7;color:var(--suc);}.bent{background:#fce7f3;color:var(--dan);}
  .pnl-row{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:.5rem;}
  .pnl-cell{border-radius:8px;padding:.48rem .7rem;}
  .pnl-cell-neu{background:var(--g50);}
  .pnl-cell-pos{background:var(--sl);}
  .pnl-cell-neg{background:var(--dl);}
  /* News */
  .ni{padding:.7rem;border-left:3px solid var(--primary);background:var(--pl);border-radius:0 8px 8px 0;margin-bottom:.5rem;}
  .ni-title{font-size:.9rem;font-weight:500;}
  .ni-meta{font-size:.75rem;color:var(--g500);margin-top:.14rem;}
  /* Trade */
  .tr-row{display:flex;gap:.45rem;align-items:flex-end;flex-wrap:wrap;margin-top:.6rem;}
  .tr-row .fg{flex:1;min-width:100px;margin-bottom:0;}
  /* Rank */
  .ri{display:flex;align-items:center;gap:.85rem;padding:.7rem;border-radius:10px;margin-bottom:.45rem;background:var(--g50);}
  .rn{font-size:1rem;font-weight:700;min-width:26px;text-align:center;}
  .rn.gold{color:#d97706;}.rn.silver{color:var(--g500);}.rn.bronze{color:var(--warn);}
  .ri-info{flex:1;}
  .ri-name{font-weight:600;font-size:.9rem;}
  .ri-sub{font-size:.76rem;color:var(--g500);}
  .ri-ret{font-size:.92rem;font-weight:700;margin-left:auto;}
  /* Deposit */
  .dc{border:1.5px solid var(--g200);border-radius:var(--r);padding:.9rem;margin-bottom:.55rem;}
  .dch{display:flex;justify-content:space-between;align-items:flex-start;}
  .dct{font-weight:600;font-size:.9rem;}
  .dcr{font-size:.8rem;color:var(--suc);font-weight:500;}
  .dcd{font-size:.73rem;color:var(--g500);margin-top:.13rem;}
  /* Company */
  .co{border:1.5px solid var(--g200);border-radius:var(--r);padding:1rem;margin-bottom:.65rem;}
  .co-hd{display:flex;align-items:center;gap:.7rem;margin-bottom:.65rem;}
  .co-ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
  .co-nm{font-weight:700;font-size:.97rem;}
  .co-desc{font-size:.86rem;color:var(--g700);line-height:1.8;margin-bottom:.65rem;}
  .co-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;}
  .co-st{background:var(--g50);border-radius:8px;padding:.55rem .7rem;text-align:center;}
  .co-stl{font-size:.7rem;color:var(--g500);margin-bottom:.12rem;}
  .co-stv{font-size:.9rem;font-weight:700;}
  /* Cashier / Teacher */
  .cr{border:1px solid var(--g200);border-radius:10px;padding:.75rem .9rem;margin-bottom:.45rem;display:flex;justify-content:space-between;align-items:center;font-size:.86rem;}
  .ci{flex:1;}.cn{font-weight:600;}.cd{color:var(--g500);font-size:.76rem;}
  .ca{display:flex;gap:.32rem;}
  .tst{font-size:.85rem;font-weight:600;color:var(--g700);margin-bottom:.65rem;padding-bottom:.35rem;border-bottom:1px solid var(--g200);}
  .stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.45rem;}
  .sti{background:var(--g50);border-radius:8px;padding:.65rem .85rem;font-size:.83rem;}
  /* Modal */
  .mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:1rem;}
  .mo.open{display:flex;}
  .mi{background:var(--card);border-radius:16px;padding:1.4rem;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;}
  .mi-t{font-size:.97rem;font-weight:700;margin-bottom:.9rem;}
  .mi-a{display:flex;gap:.45rem;margin-top:.9rem;}
  /* Toast */
  #toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--g900);color:var(--g50);padding:.56rem 1.1rem;border-radius:20px;font-size:.86rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;}
  /* Version badge */
  .ver{position:fixed;bottom:.6rem;right:.8rem;font-size:.7rem;color:var(--g500);background:rgba(255,255,255,.8);padding:.15rem .5rem;border-radius:20px;z-index:50;}
  [data-theme="dark"] .ver{background:rgba(0,0,0,.5);}
  /* Utils */
  .mt1{margin-top:.5rem;}.mt2{margin-top:1rem;}
  .flex{display:flex;}.gap2{gap:.5rem;}.jb{justify-content:space-between;}.ac{align-items:center;}
  .tsm{font-size:.84rem;}.txs{font-size:.75rem;}.fb{font-weight:700;}.tr{text-align:right;}
  .tg{color:var(--g500);}.tp{color:var(--primary);}.tsuc{color:var(--suc);}.tdan{color:var(--dan);}
  .div{border:none;border-top:1px solid var(--g200);margin:.9rem 0;}
  .empty{text-align:center;color:var(--g500);font-size:.85rem;padding:1.5rem;}
  .pbg{background:var(--wl);color:var(--warn);border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:600;}
  input[type=number]{-moz-appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
  /* 데스크탑: 상단 탭 표시, 하단 탭 숨김 */
  [data-theme="dark"] .bsemi{background:#1e3a5f;color:#93c5fd;}
  [data-theme="dark"] .bfood{background:#064e3b;color:#6ee7b7;}
  [data-theme="dark"] .bent{background:#4a1942;color:#f9a8d4;}
  [data-theme="dark"] .pb.pos{border-color:#065f46;}
  [data-theme="dark"] .pb.neg{border-color:#7f1d1d;}
  [data-theme="dark"] .rn.gold{color:#fbbf24;}
  [data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--card);color:var(--g900);border-color:var(--g200);}
  [data-theme="dark"] input{background:var(--card);color:var(--g900);}
  [data-theme="dark"] .ni{background:var(--pl);border-left-color:var(--primary);}
  [data-theme="dark"] .dc{border-color:var(--g200);}
  [data-theme="dark"] .sc{border-color:var(--g200);}
  [data-theme="dark"] .co{border-color:var(--g200);}
  @media(min-width:769px){.nav-tabs{display:flex!important;}.bottom-tabs{display:none!important;}.mc{padding-bottom:1.1rem;}}
  @media(max-width:480px){.sg{grid-template-columns:1fr 1fr;}.mc{padding:.9rem .75rem;padding-bottom:5rem;}.topbar{padding:0 .85rem;}.student-grid-sel{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>

<!-- Loading -->
<div id="loadingScreen" style="position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
  <div style="font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:var(--primary);margin-bottom:1rem;">DAIZE 투자시스템</div>
  <div style="font-size:.85rem;color:var(--g500);margin-bottom:2rem;">한결초등학교 다이제국 전용</div>
  <div style="width:40px;height:40px;border:3px solid var(--g200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;"></div>
  <div id="loadingMsg" style="font-size:.78rem;color:var(--g500);margin-top:1rem;">서버에 연결하는 중...</div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<!-- 주말 배너 -->
<div id="weekendBanner" style="display:none;background:var(--wl);color:var(--warn);text-align:center;padding:.6rem;font-size:.85rem;font-weight:500;position:sticky;top:52px;z-index:90;">
  📅 주말에는 시장이 열리지 않습니다. 평일(월~금)에 거래해 주세요.
</div>

<div class="ver">v3.9</div>

<div id="loginScreen" style="display:none;">
  <div class="lcard">
    <div class="llogo">
      <img src="daize_logo.png" alt="DAIZE 로고" style="width:140px;margin-bottom:.5rem;" onerror="this.style.display='none'"/>
      <h1>DAIZE 학급 운영 시스템</h1>
      <p>한결초등학교 다이제국 전용</p>
    </div>
    <div class="fg"><label>로그인 유형</label>
      <select id="loginType" onchange="updateLoginForm()">
        <option value="student">학생</option><option value="teacher">선생님</option>
      </select>
    </div>
    <div id="stuFields">
      <div class="fg">
        <label>이름 선택</label>
        <input type="hidden" id="stuSel" value=""/>
        <div class="student-grid-sel" id="stuGrid"></div>
      </div>
      <div class="fg"><label>비밀번호</label><input type="password" id="stuPw" maxlength="12" placeholder="문자+숫자 조합" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    </div>
    <div id="tchFields" style="display:none;">
      <div class="fg"><label>선생님 비밀번호</label><input type="password" id="tchPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    </div>
    <button class="btn bp bfull" style="margin-top:.4rem;" onclick="doLogin()" disabled>로그인</button>
    <div style="text-align:center;color:var(--g500);font-size:.75rem;margin:.85rem 0;">— 또는 —</div>
    <button class="btn bs bfull" onclick="showSetPwModal()" disabled>비밀번호 처음 설정</button>
  </div>
</div>

<div id="appScreen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:.7rem;">
      <img src="daize_logo.png" alt="" style="height:32px;" onerror="this.style.display='none'"/>
      <div class="tlogo">DAIZE 학급 운영</div>
      <div style="font-size:.8rem;color:var(--g700);" id="topbarUser"></div>
    </div>
    <div style="display:flex;align-items:center;gap:.45rem;">
      <span style="font-size:.68rem;color:var(--g500);" id="dateDisp"></span>
      <span id="timerDisp" style="display:none;font-size:.75rem;font-weight:700;padding:.18rem .55rem;border-radius:20px;background:var(--wl);color:var(--warn);"></span>
      <button class="btn bs bsm" onclick="toggleDarkMode()" id="darkToggle" title="다크모드" style="font-size:1rem;padding:.3rem .5rem;">🌙</button>
      <button class="btn bs bsm" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="nav-tabs" id="navTabs"></div>
  <div class="mc" id="mainContent"></div>
  <div class="bottom-tabs" id="bottomTabs"></div>
</div>

<div class="mo" id="modalOverlay">
  <div class="mi">
    <div class="mi-t" id="mTitle"></div>
    <div id="mBody"></div>
    <div class="mi-a" id="mActs"></div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
const STUDENTS=[
  {no:1,name:'강이준'},{no:2,name:'구나혜'},{no:3,name:'김다해'},{no:4,name:'김시환'},
  {no:5,name:'김은중'},{no:6,name:'김지유'},{no:7,name:'김태연'},{no:8,name:'류다현'},
  {no:9,name:'박승현'},{no:10,name:'박유성'},{no:11,name:'손서율'},{no:12,name:'신서윤'},
  {no:13,name:'양이든'},{no:14,name:'오윤재'},{no:15,name:'오은우'},{no:16,name:'유체정'},
  {no:17,name:'이학진'},{no:18,name:'장연두'},{no:19,name:'전하율'},{no:20,name:'조혜리'},
  {no:21,name:'최은재'},{no:22,name:'허남희'},{no:23,name:'황동현'},{no:30,name:'김승언'}
];
const TEST_ACCOUNTS=['김승언']; // 테스트 계정 — 순위/순찰/과제에서 제외
// 실제 학생 목록 (테스트 계정 + 동적 추가/삭제 반영)
function realStudents(){
  const base=STUDENTS.filter(s=>!TEST_ACCOUNTS.includes(s.name));
  const extra=(state&&state.extraStudents)||[];
  const removed=(state&&state.removedStudents)||[];
  return [...base,...extra].filter(s=>!removed.includes(s.name));
}
const STOCKS=[
  {id:'semi',name:'DAIZE 반도체',sector:'반도체',badge:'bsemi',emoji:'💻',color:'#1e40af',bg:'#dbeafe'},
  {id:'food',name:'DAIZE 식품',  sector:'식품',  badge:'bfood',emoji:'🍱',color:'#166534',bg:'#dcfce7'},
  {id:'ent', name:'DAIZE 엔터',  sector:'엔터',  badge:'bent', emoji:'🎵',color:'#9d174d',bg:'#fce7f3'}
];
const CO_INFO={
  semi:{
    fullName:'DAIZE 반도체 주식회사',

// Helpers
function kst(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+9*3600000);}
function isWE(){const d=kst().getDay();return d===0||d===6;}
function fE2(n){return parseFloat(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')+' 유로';}
function fE(n){return Math.round(n).toLocaleString('ko-KR')+' 유로';}
function dStr(d){if(!d)d=kst();const dt=typeof d==='string'?new Date(d):d;return`${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일`;}
function daysLeft(dateStr){const now=kst();const t=new Date(dateStr);const diff=Math.ceil((t-now)/(1000*60*60*24));return Math.max(0,diff);}

// 30-day pre-sim
function sim30(){
  const h={semi:[100],food:[100],ent:[100]},news=[];
  for(let d=0;d<30;d++){
    const big=(d===14||d===29);
    STOCKS.forEach(s=>{
      const pool=NP[s.id],ni=pool[Math.floor(Math.random()*pool.length)];
      let mc=big?0.10:0.03,c=(Math.random()*mc*2)-mc;
      if(ni.p)c=Math.abs(c); else c=-Math.abs(c);
      const prev=h[s.id][h[s.id].length-1];
      const np=Math.max(0.01,parseFloat((prev*(1+c)).toFixed(2)));
      h[s.id].push(np);
      news.unshift({sid:s.id,t:ni.t,p:ni.p,date:`${30-d}일 전`,price:np,prev,chg:((np-prev)/prev*100).toFixed(2)});
    });
  }
  return{h,news:news.slice(0,60)};
}

// ── 시장 시간 헬퍼
// 8:00 — 오늘의 뉴스 3건 발행
// 9:00, 11:00, 12:50, 14:00 — 시세 변동 (뉴스 영향 + 랜덤 무빙) 4회
// 14:00 — 최종 종가 확정
// 거래 가능 시간: 평일 8:40~14:00

function isMarketOpen(){
  if(isWE()) return false;
  const now=kst();
  const h=now.getHours(), m=now.getMinutes();
  const mins=h*60+m;
  return mins>=8*60+40 && mins<14*60;
}

function getMarketUpdateKey(now){
  const h=now.getHours(), m=now.getMinutes();
  const dateStr=now.toDateString();
  if(h>=8&&h<9)               return `${dateStr}-0800`; // 뉴스 발행
  if(h===9)                    return `${dateStr}-0900`;
  if(h===11)                   return `${dateStr}-1100`;
  if(h===12&&m>=50||h===13&&m<50) return `${dateStr}-1250`;
  if(h>=14)                    return `${dateStr}-1400`;
  return null;
}

function marketStatus(){
  if(isWE()) return '주말 휴장';
  const now=kst();
  const h=now.getHours(),m=now.getMinutes();
  const mins=h*60+m;
  if(mins<8*60) return '뉴스 발행 전 (8:00)';
  if(mins<8*60+40){
    const hasNews=(state.todayNews&&state.todayNews.date===now.toDateString());
    return hasNews?'📰 뉴스 확인 중 · 8:40 개장':'뉴스 발행 중...';
  }
  if(mins<14*60){
    const next=[[9,0],[11,0],[12,50],[14,0]].find(([hh,mm])=>hh*60+mm>mins);
    if(next) return `장중 · 다음 변동 ${next[0]}:${String(next[1]).padStart(2,'0')}`;
    return '장중';
  }
  return '14:00 종가 확정 (장 마감)';
}

function runMarket(){
  if(!state) return;
  if(isWE()) return;

  const now=kst();
  const dateStr=now.toDateString();
  const hourKey=getMarketUpdateKey(now);
  if(!hourKey) return;
  if(state.lastHour===hourKey) return;

  const isNews=hourKey.endsWith('-0800');
  const isFinal=hourKey.endsWith('-1400');
  const isFirstToday=(state.lastMD!==dateStr);
  state.lastHour=hourKey;

  // ── 8:00: 오늘의 뉴스 발행 (시세 변동 없음)
  if(isNews){
    const todayNews=[];
    STOCKS.forEach(s=>{
      const pool=NP[s.id];
      let ni=null;
      // 교사 이슈 먼저 사용
      if(state.teacherIssues&&state.teacherIssues.length>0){
        const issue=state.teacherIssues.find(i=>i.sid===s.id&&!i.used);
        if(issue){ni={t:issue.text,p:issue.p};issue.used=true;}
      }
      if(!ni) ni=pool[Math.floor(Math.random()*pool.length)];
      todayNews.push({sid:s.id,t:ni.t,p:ni.p});
      // 뉴스 목록에도 추가 (시세 반영 전이므로 chg 없음)
      state.news.unshift({
        sid:s.id,t:ni.t,p:ni.p,
        date:dStr(),price:state.stocks[s.id].price,prev:state.stocks[s.id].price,
        chg:'0.00',time:'8:00',isBreaking:true
      });
    });
    state.todayNews={date:dateStr,items:todayNews};
    if(state.teacherIssues) state.teacherIssues=state.teacherIssues.filter(i=>!i.used);
    if(state.news.length>100) state.news=state.news.slice(0,100);
    ss();
    return;
  }

  // ── 9:00/11:00/12:50/14:00: 시세 변동
  if(isFinal){ state.lastMD=dateStr; state.dayCount++; }

  // 오늘 첫 시세변동 시 시가 저장
  if(isFirstToday||!state.stocks[STOCKS[0].id].todayOpen?.[dateStr]){
    STOCKS.forEach(s=>{
      if(!state.stocks[s.id].todayOpen) state.stocks[s.id].todayOpen={};
      state.stocks[s.id].todayOpen[dateStr]=state.stocks[s.id].price;
    });
  }

  const big=isFinal&&(state.dayCount%22===0);
  const modeMap={
    normal:{max:0.015,bias:0},
    bull:  {max:0.02, bias:0.004},
    bear:  {max:0.02, bias:-0.004},
    flat:  {max:0.005,bias:0},
    surge: {max:0.06, bias:0.03},
    crash: {max:0.07, bias:-0.04},
  };
  const globalMode=modeMap[state.marketMode||'normal']||modeMap.normal;
  const scale=isFinal?1:0.33;
  const todayNewsItems=(state.todayNews&&state.todayNews.date===dateStr)?state.todayNews.items:[];
  const timeLabel=hourKey.split('-').pop();
  const timeMap={'0900':'9:00','1100':'11:00','1250':'12:50','1400':'14:00'};
  const timeStr=timeMap[timeLabel]||'';

  STOCKS.forEach(s=>{
    const stockModeKey=(state.stockMode||{})[s.id]||'normal';
    const stockMode=modeMap[stockModeKey]||modeMap.normal;
    const baseMode=stockModeKey==='normal'?globalMode:stockMode;
    const m=big?{max:0.08*scale,bias:baseMode.bias*1.5}:{max:baseMode.max*scale,bias:baseMode.bias*scale};

    // 뉴스 영향: 오늘 뉴스의 호재/악재 반영 (매 변동마다 일부씩)
    const todayNI=todayNewsItems.find(n=>n.sid===s.id);
    let c=(Math.random()*m.max*2-m.max)+m.bias;
    if(todayNI){
      const newsInfluence=0.25+Math.random()*0.25; // 25~50% 뉴스 영향
      if(todayNI.p) c=c*(1-newsInfluence)+Math.abs(c)*newsInfluence;
      else          c=c*(1-newsInfluence)-Math.abs(c)*newsInfluence;
    }
    c=c-0.0005*scale; // 미세 하락 바이어스

    const prev=state.stocks[s.id].price;
    const np=Math.max(1,parseFloat((prev*(1+c)).toFixed(2)));
    state.stocks[s.id].price=np;

    // 인트라데이 기록
    if(!state.stocks[s.id].intraday) state.stocks[s.id].intraday=[];
    state.stocks[s.id].intraday.push({time:timeStr,price:np,prev,chg:((np-prev)/prev*100).toFixed(2)});
    if(state.stocks[s.id].intraday.length>8) state.stocks[s.id].intraday=state.stocks[s.id].intraday.slice(-8);

    // 시세 변동 뉴스 (변동 결과)
    state.news.unshift({
      sid:s.id,t:todayNI?todayNI.t:'시장 변동',p:todayNI?todayNI.p:(c>=0),
      date:dStr(),price:np,prev,
      chg:((np-prev)/prev*100).toFixed(2),
      time:timeStr,isFinal
    });

    if(isFinal){
      state.stocks[s.id].history.push(np);
      if(state.stocks[s.id].history.length>61) state.stocks[s.id].history.shift();
      if(!state.stocks[s.id].dateHistory) state.stocks[s.id].dateHistory=[];
      state.stocks[s.id].dateHistory.push(`${now.getMonth()+1}/${now.getDate()}`);
      if(state.stocks[s.id].dateHistory.length>61) state.stocks[s.id].dateHistory.shift();
      state.stocks[s.id].intraday=[]; // 다음날용 초기화
    }
  });

  if(state.news.length>100) state.news=state.news.slice(0,100);

  // 14:00 만기 예금 처리
  if(isFinal){
    const now2=kst();
    STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
      const st=state.students[s.name];
      if(!st||!st.deps) return;
      st.deps.forEach(dep=>{
        if(!dep.done&&!dep.er&&new Date(dep.md)<=now2){
          dep.done=true;
          const int=Math.round(dep.amt*dep.rate*dep.mon);
          const tax=Math.round(int*0.01);
          st.bal=parseFloat((st.bal+dep.amt+int-tax).toFixed(2));
          dep.ret=dep.amt+int-tax;dep.tax=tax;
        }
      });
    });
  }
  ss();
}

// ── 접속 타이머 (학생 전용, 하루 N분)
let sessionTimer=null,sessionLeft=0;

function getTodayKey(){
  const d=kst();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getSessionLimit(){ return ((state&&state.timerMinutes)||15)*60; }

function getUsedSeconds(name){
  return (state?.students?.[name]?.usedTime?.[getTodayKey()])||0;
}
async function saveUsedSeconds(name,secs){
  const st=state?.students?.[name];
  if(!st) return;
  if(!st.usedTime) st.usedTime={};
  const today=getTodayKey();
  st.usedTime[today]=secs;
  // usedTime만 직접 경로에 저장 (set으로 해당 날짜 키만)
  try{
    await set(ref(db,ROOT+`/students/${name}/usedTime/${today}`),secs);
  }catch(e){}
}
async function getUsedSecondsFromDB(name){
  // 로그인 시 Firebase에서 직접 읽어 정확한 값 사용
  try{
    const today=getTodayKey();
    const snap=await get(ref(db,ROOT+`/students/${name}/usedTime/${today}`));
    return snap.exists()?parseInt(snap.val()||0):0;
  }catch(e){ return getUsedSeconds(name); }
}
function isBlockedToday(name){
  // state에 저장된 값으로 체크 (로그인 시점에 최신값이 state에 반영되어 있음)
  const used=getUsedSeconds(name);
  const limit=getSessionLimit();
  return used>=limit;
}

async function startSessionTimer(){
  try{
  if(sessionTimer){ clearInterval(sessionTimer); sessionTimer=null; }
  if(!cu||cu.type==='teacher') return;
  if(cu.isCashier||cu.isPolice){
    const d=document.getElementById('timerDisp'); if(d) d.style.display='none'; return;
  }
  if(state&&state.timerEnabled===false){
    const d=document.getElementById('timerDisp'); if(d) d.style.display='none'; return;
  }
  const limit=getSessionLimit();
  let usedFromDB=0;
  try{ usedFromDB=await getUsedSecondsFromDB(cu.name); }catch(e){ usedFromDB=getUsedSeconds(cu.name); }
  if(state?.students?.[cu.name]){
    if(!state.students[cu.name].usedTime) state.students[cu.name].usedTime={};
    state.students[cu.name].usedTime[getTodayKey()]=usedFromDB;
  }
  sessionLeft=Math.max(0,limit-usedFromDB);
  const d=document.getElementById('timerDisp'); if(d) d.style.display='';
  if(sessionLeft<=0){ forceLogoutByTimer(); return; }
  updateTimerDisplay();
  sessionTimer=setInterval(()=>{
    sessionLeft=Math.max(0,sessionLeft-1);
    saveUsedSeconds(cu.name,getSessionLimit()-sessionLeft);
    updateTimerDisplay();
    if(sessionLeft<=0){ clearInterval(sessionTimer); sessionTimer=null; forceLogoutByTimer(); }
  },1000);
  }catch(e){console.warn('Timer error:',e);}
}

function updateTimerDisplay(){
  const d=document.getElementById('timerDisp');
  if(!d) return;
  if(!cu||cu.type==='teacher'||state?.timerEnabled===false){d.style.display='none';return;}
  const m=Math.floor(sessionLeft/60),s=sessionLeft%60;
  d.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  d.style.display='';
  d.style.background=sessionLeft<120?'#fee2e2':sessionLeft<300?'#fef3c7':'#d1fae5';
  d.style.color=sessionLeft<120?'#991b1b':sessionLeft<300?'#92400e':'#065f46';
}

function forceLogoutByTimer(){
  if(sessionTimer){ clearInterval(sessionTimer); sessionTimer=null; }
  const name=cu?.name||'';
  const mins=(state?.timerMinutes)||15;
  // 오늘 재로그인 차단 — limit+1 저장
  if(name) saveUsedSeconds(name, getSessionLimit()+1);
  // 즉시 강제 로그아웃
  doLogout();
  showToast(`⏱ ${name} 오늘 접속 시간(${mins}분) 종료. 내일 다시 접속하세요.`);
}

// Cost basis
function updateCB(name,sid,qty,price,buy){
  const st=state.students[name];
  if(!st.cb) st.cb={semi:0,food:0,ent:0};
  if(buy){
    const cq=st.hld[sid]||0,cc=st.cb[sid]||0;
    st.cb[sid]=cq+qty>0?(cc*cq+price*qty)/(cq+qty):0;
  } else {
    if((st.hld[sid]||0)-qty<=0) st.cb[sid]=0;
  }
}

// Calc portfolio
function calcP(name){
  // students 데이터 없으면 기본값 반환
  if(!state.students) state.students={};
  if(!state.students[name])
    state.students[name]={bal:0,hld:{semi:0,food:0,ent:0},deps:[],dep0:0,cb:{semi:0,food:0,ent:0}};
  const st=state.students[name];
  if(!st.hld) st.hld={semi:0,food:0,ent:0};
  if(!st.cb)  st.cb={semi:0,food:0,ent:0};
  if(!st.deps) st.deps=[];
  if(!state.stocks) return{st,sv:0,total:st.bal||0,inv:st.dep0||0,tpnl:-(st.dep0||0),tpct:0,sd:[],dl:0};
  let sv=0;
  const sd=STOCKS.map(s=>{
    const q=st.hld[s.id]||0,cp=state.stocks[s.id].price,ac=st.cb[s.id]||0;
    const val=q*cp,cost=q*ac,pnl=val-cost,pct=cost>0?(pnl/cost*100):0;
    sv+=val;
    return{s,q,cp,ac,val,cost,pnl,pct};
  });
  const dl=(st.deps||[]).filter(d=>!d.done&&!d.er).reduce((a,d)=>a+d.amt,0);
  const total=st.bal+sv+dl;
  const rawInv=st.dep0||0;
  const iconSpent=st.iconSpent||0;
  // 이모지 구매·기부 지출은 투자와 무관 → 원금에서 차감하여 실질 투자 원금 산출
  // 손익 = 현재 총자산 - 실질 투자 원금 + 이모지/기부 지출분(돌려줌)
  // = 총자산 - (원금 - 지출) = 총자산 - 원금 + 지출
  const tpnl=total-rawInv+iconSpent;
  const inv=Math.max(0,rawInv-iconSpent);
  const tpct=inv>0?(tpnl/inv*100):0;
  return{st,sv,total,inv,tpnl,tpct,sd,dl};
}

  if(!pw||pw.length<4||pw.length>12) return false;
  const hasLetter=/[a-zA-Z가-힣]/.test(pw); // 영문 또는 한글 포함
  const hasNumber=/[0-9]/.test(pw);
  return hasLetter&&hasNumber;
}

// 복권 이모지 암호화 헬퍼 (base64 + 간단 XOR)
const _LK='\x64\x61\x69\x7a\x65'; // 'daize'
function _enc(arr){
  const s=JSON.stringify(arr);
  let x='';for(let i=0;i<s.length;i++)x+=String.fromCharCode(s.charCodeAt(i)^_LK.charCodeAt(i%_LK.length));
  const bytes=new TextEncoder().encode(x);
  let b='';bytes.forEach(b2=>b+=String.fromCharCode(b2));
  return btoa(b);
}
function _dec(str){
  try{
    const bin=atob(str);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const x=new TextDecoder().decode(bytes);
    let s='';for(let i=0;i<x.length;i++)s+=String.fromCharCode(x.charCodeAt(i)^_LK.charCodeAt(i%_LK.length));
    return JSON.parse(s);
  }catch(e){return['🍀','💎','🌟','🏆','🔮'];}
}
// 복권 이모지 읽기/쓰기
function getLotteryEmojis(){
  if(state._le) return _dec(state._le);
  if(state.lotteryEmojis) return state.lotteryEmojis; // 구버전 호환
  return _dec(''); // 기본값
}
function setLotteryEmojis(arr){
  state._le=_enc(arr);
  delete state.lotteryEmojis; // 평문 제거
}

function doIconPurchase(){
  const st=state.students[cu.name];
  const disp=document.getElementById('selectedIconDisp');
  const sel=disp?disp.textContent.trim():'';
  if(!sel){showToast('이모지를 선택해주세요.');return;}
  const price=emojiPrice(sel);
  if((st.bal||0)<price){showToast(`잔액 부족 (필요: ${price}유로)`);return;}
  st.bal=parseFloat((st.bal-price).toFixed(2));
  st.iconSpent=(st.iconSpent||0)+price;
  if(!st.iconMap) st.iconMap={};
  st.iconMap[sel]=true;
  const isLotteryEmoji=getLotteryEmojis().includes(sel);
  const alreadyWon=(state.lotteryWon||{})[sel];
  let isWin=false;
  if(isLotteryEmoji&&!alreadyWon){
    isWin=true;
    st.bal=parseFloat((st.bal+100).toFixed(2));
    if(!state.lotteryWon) state.lotteryWon={};
    state.lotteryWon[sel]=cu.name;
  }
  st.customEmoji=sel;
  ss();closeModal();
  if(isWin){
    playSound('win');
    setTimeout(()=>{openModal('🎉 복권 당첨!',`
      <div style="text-align:center;padding:.5rem 0;">
        <div style="font-size:4rem;margin-bottom:.5rem;">${sel}</div>
        <div style="font-size:1.3rem;font-weight:700;color:var(--suc);margin-bottom:.4rem;">+100유로 지급!</div>
        <div style="font-size:.88rem;color:var(--g700);">${cu.name} 학생이 ${sel} 이모지<br/>최초 구매자로 100유로를 받았습니다! 🥳</div>
      </div>
    `,[{l:'🎉 확인!',c:'bsuc',f:closeModal}]);},300);
  } else if(isLotteryEmoji&&alreadyWon){
    showToast(`${sel}은 이미 ${alreadyWon}이(가) 당첨했어요!`);
  } else {
    playSound('buy');
    showToast(`${sel} 구매 완료! (${price}유로)`);
  }
  populateStudentSelect();
  updateTopbarLabel();
  switchTab('portfolio');
}

function miniChart(history,isUp){
  const data=history.slice(-31);if(data.length<2)return'';
  const min=Math.min(...data),max=Math.max(...data);
  const w=300,h=50,rng=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/rng)*h}`).join(' ');
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;"><polyline points="${pts}" fill="none" stroke="${isUp?'#0e9f6e':'#e02424'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// 날짜 포함 상세 차트 (시장 현황용)
// 인트라데이 차트 (오늘 시세 변동)
function intradayChart(sid){
  const stk=state.stocks[sid];
  const intraday=stk.intraday||[];
  if(intraday.length<1) return '';
  
  // 시가 포함
  const todayDateStr=kst().toDateString();
  const openPrice=stk.todayOpen?.[todayDateStr]||intraday[0].prev;
  const points=[{time:'시가',price:openPrice},...intraday.map(d=>({time:d.time,price:d.price}))];
  
  const prices=points.map(p=>p.price);
  const mn=Math.min(...prices),mx=Math.max(...prices),rng=mx-mn||1;
  const W=300,H=70,PAD={t:14,r:8,b:22,l:44};
  const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;
  const px=(i)=>PAD.l+(i/(points.length-1))*cw;
  const py=(v)=>PAD.t+ch-((v-mn)/rng)*ch;
  const color=points[points.length-1].price>=openPrice?'#0e9f6e':'#e02424';
  const fillColor=points[points.length-1].price>=openPrice?'rgba(14,159,110,.12)':'rgba(224,36,36,.12)';
  
  const pts=points.map((p,i)=>`${px(i)},${py(p.price)}`).join(' ');
  const fillPts=`${px(0)},${PAD.t+ch} `+pts+` ${px(points.length-1)},${PAD.t+ch}`;
  
  let labels='';
  points.forEach((p,i)=>{
    labels+=`<text x="${px(i)}" y="${H-3}" text-anchor="middle" font-size="8" fill="var(--g500)">${p.time}</text>`;
  });
  
  let dots='';
  points.forEach((p,i)=>{
    const chgFromOpen=((p.price-openPrice)/openPrice*100).toFixed(2);

function detailChart(sid){
  const stk=state.stocks[sid];
  const hist=stk.history||[];
  const dateHist=stk.dateHistory||[];
  if(hist.length<2) return '<div class="empty txs">데이터 부족</div>';

  const todayDateStr=kst().toDateString();
  const todayConfirmed=state.lastMD===todayDateStr;
  const now=kst();
  const todayLabel=`${now.getMonth()+1}/${now.getDate()}`;

  // 오늘 14시 미확정이면 현재가를 임시 마지막 포인트로 추가
  let data=[...hist.slice(-30)];
  let dates=dateHist.length>=hist.length
    ? [...dateHist.slice(-30)]
    : data.map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(data.length-1-i)); return`${d.getMonth()+1}/${d.getDate()}`; });

  // 오늘 미확정 && 현재가가 마지막 종가와 다르면 오늘 현재가 추가
  if(!todayConfirmed && stk.price!==data[data.length-1]){
    data=[...data, stk.price];
    dates=[...dates, todayLabel+'*']; // * = 미확정
  }

  const W=320,H=130,PAD={t:18,r:12,b:32,l:48};
  const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;

  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||1;
  const px=(i)=>PAD.l+(i/(data.length-1))*cw;
  const py=(v)=>PAD.t+ch-((v-mn)/rng)*ch;
  const color=data[data.length-1]>=data[0]?'#0e9f6e':'#e02424';
  const fillColor=data[data.length-1]>=data[0]?'rgba(14,159,110,.08)':'rgba(224,36,36,.08)';

  const pts=data.map((v,i)=>`${px(i)},${py(v)}`).join(' ');
  const fillPts=`${px(0)},${PAD.t+ch} `+data.map((v,i)=>`${px(i)},${py(v)}`).join(' ')+` ${px(data.length-1)},${PAD.t+ch}`;

  const yTicks=[mn, (mn+mx)/2, mx];
  let yAxis='';
  yTicks.forEach(v=>{
    const y=py(v);
    yAxis+=`<line x1="${PAD.l-4}" y1="${y}" x2="${PAD.l+cw}" y2="${y}" stroke="var(--g200)" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="${PAD.l-6}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--g500)">${v.toFixed(0)}</text>`;
  });

  let xAxis='';
  const step=Math.ceil(data.length/5);
  for(let i=0;i<data.length-1;i+=step){
    xAxis+=`<text x="${px(i)}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="var(--g500)">${dates[i]||''}</text>`;
  }
  // 마지막 날짜 (오늘, 미확정이면 다르게 표시)
  const lastLabel=dates[dates.length-1]||'';
  const isLive=lastLabel.endsWith('*');
  xAxis+=`<text x="${px(data.length-1)}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="${color}" font-weight="bold">${isLive?lastLabel.replace('*',''):''}${isLive?'':lastLabel}</text>`;

  const lastX=px(data.length-1), lastY=py(data[data.length-1]);
  const firstX=px(0), firstY=py(data[0]);

  let hoverRects='';
  data.forEach((v,i)=>{
    const x=px(i);
    const rectW=cw/Math.max(data.length-1,1);
    hoverRects+=`<g class="chart-pt" style="cursor:pointer;">
      <rect x="${x-rectW/2}" y="${PAD.t}" width="${rectW}" height="${ch}" fill="transparent"/>
      <circle cx="${x}" cy="${py(v)}" r="2.5" fill="${color}" opacity="0" class="chart-dot"/>
      <title>${dates[i]||''}: ${fE2(v)}</title>
    </g>`;
  });

  // 오늘 미확정이면 점선으로 마지막 선분 표시
  let liveSegment='';
  if(!todayConfirmed && data.length>=2){
    const sx=px(data.length-2), sy=py(data[data.length-2]);
    liveSegment=`<line x1="${sx}" y1="${sy}" x2="${lastX}" y2="${lastY}" stroke="${color}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible;">
    <style>.chart-pt:hover .chart-dot{opacity:1;}.chart-pt:hover rect{fill:rgba(0,0,0,.03);}</style>
    ${yAxis}${xAxis}
    <polygon points="${fillPts}" fill="${fillColor}"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${liveSegment}
    <circle cx="${firstX}" cy="${firstY}" r="3" fill="var(--g400)"/>
    <circle cx="${lastX}" cy="${lastY}" r="4" fill="${color}" stroke="white" stroke-width="1.5" ${!todayConfirmed?'stroke-dasharray="2,1"':''}/>
    <text x="${lastX}" y="${lastY-8}" text-anchor="middle" font-size="10" font-weight="bold" fill="${color}">${fE2(data[data.length-1])}</text>
    ${hoverRects}
  </svg>`;
}

    const fee=parseFloat((qty*(state.sellFee||1)).toFixed(2));

    if(proc<0){showToast('수수료가 매도금액보다 큽니다.');return;}
    openModal(`${sEmoji} ${sn} 매도 확인`,`

            <span class="txs">매도 금액</span><span class="txs fb">${fE2(qty*stk.price)}</span>

    `,[

        closeModal();doExTrade(sid,'sell',qty);
      }},{l:'취소',c:'bs',f:closeModal}

function doExTrade(sid,action,qty){
  const st=state.students[cu.name],stk=state.stocks[sid];
  const sn=STOCKS.find(s=>s.id===sid).name;
  if(action==='buy'){
    const cost=parseFloat((qty*stk.price).toFixed(2));
    if(cost>st.bal){showToast('잔액 변동으로 매수 실패');return;}
    updateCB(cu.name,sid,qty,stk.price,true);
    st.bal=parseFloat((st.bal-cost).toFixed(2));
    st.hld[sid]=(st.hld[sid]||0)+qty;
    const upd={bal:st.bal,[`hld/${sid}`]:st.hld[sid],[`cb/${sid}`]:st.cb[sid]};
    update(ref(db,ROOT+'/students/'+cu.name),upd).catch(()=>{});
    addTxLog('deposit',cu.name,cost,cu.name,`${sn} ${qty}주 매수 @${fE2(stk.price)}`);
    ssNow();
    showToast(`${sn} ${qty}주 매수 완료! 🎉`);
    playSound('buy');
  } else {
    const held=st.hld[sid]||0;
    if(qty>held){showToast('보유 수량 변동으로 매도 실패');return;}
    const fee=parseFloat((qty*(state.sellFee||1)).toFixed(2));
    const proc=parseFloat((qty*stk.price-fee).toFixed(2));
    updateCB(cu.name,sid,qty,stk.price,false);
    st.bal=parseFloat((st.bal+proc).toFixed(2));
    st.hld[sid]-=qty;
    const upd={bal:st.bal,[`hld/${sid}`]:st.hld[sid],[`cb/${sid}`]:st.cb[sid]};
    update(ref(db,ROOT+'/students/'+cu.name),upd).catch(()=>{});
    addTxLog('withdraw',cu.name,proc,cu.name,`${sn} ${qty}주 매도 @${fE2(stk.price)} (수수료 ${fE2(fee)})`);
    ssNow();
    showToast(`${sn} ${qty}주 매도 완료! (+${fE2(proc)})`);
    playSound('sell');
  }
  const tradeEl=document.getElementById('investSubContent')||document.getElementById('tab-trade');
  if(tradeEl) rTrade(tradeEl);
}

function openDep(){
  const st=state.students[cu.name];
  const amt=parseFloat(document.getElementById('dA').value),mon=parseInt(document.getElementById('dM').value);
  if(!amt||amt<=0){showToast('금액을 입력해주세요.');return;}
  if(amt>st.bal){showToast('투자 가능 금액 부족');return;}
  const rate=mon===1?0.03:0.04,now=kst(),mat=new Date(now);
  mat.setMonth(mat.getMonth()+mon);
  st.bal=parseFloat((st.bal-amt).toFixed(2));
  if(!st.deps)st.deps=[];
  st.deps.push({amt,mon,rate,sd:now.toISOString(),md:mat.toISOString(),done:false,er:false});
  st.dep0=(st.dep0||0)+amt;
  // 부분 업데이트
  update(ref(db,ROOT+'/students/'+cu.name),{bal:st.bal,dep0:st.dep0,deps:st.deps}).catch(()=>{});

  const depEl=document.getElementById('investSubContent')||document.getElementById('tab-deposit');
  if(depEl) rDeposit(depEl);
}

// ── RANK
let rankShowMore={profit:false,pct:false,don:false,donTab:'month',dep:false};
function rRank(el){
  const resetDate=state.rankResetDate||null;
  const now=kst();
  const thisMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const thisYear=`${now.getFullYear()}`;
  const monthLabel=`${now.getMonth()+1}월`;
  const yearLabel=`${now.getFullYear()}년`;

  const all=realStudents().map(s=>{
    const p=calcP(s.name);
    const st=state.students[s.name];
    const iconCount=Object.keys(st?.iconMap||{}).length;
    const logs=(state.donationLog||[]).filter(d=>d.name===s.name);
    const donMonthly=logs.filter(d=>d.ts&&d.ts.startsWith(thisMonth)).reduce((a,d)=>a+(d.amount||0),0);
    const donYearly=logs.filter(d=>d.ts&&d.ts.startsWith(thisYear)).reduce((a,d)=>a+(d.amount||0),0);
    const depTotal=(st?.deps||[]).filter(d=>!d.done&&!d.er).reduce((a,d)=>a+(d.amt||0),0);

    return{name:s.name,no:s.no,...p,iconCount,donMonthly,donYearly,depTotal};
  });
  const isMine=r=>cu.type==='student'&&r.name===cu.name;
  const isTeacher=cu.type==='teacher';

  // 이전 순위 저장/비교
  if(!window._prevRanks) window._prevRanks={};
  function saveRanks(key,rows){
    const cur={};
    rows.forEach((r,i)=>cur[r.name]=i+1);
    const prev=window._prevRanks[key]||{};
    window._prevRanks[key]=cur;
    return prev;
  }
  function rankDelta(prevRanks,name,curRank){
    if(!prevRanks[name]) return '';
    const diff=prevRanks[name]-curRank;
    if(diff===0) return '';
    if(diff>0) return `<span style="font-size:.62rem;color:var(--suc);font-weight:700;margin-left:.3rem;">▲${diff}</span>`;
    return `<span style="font-size:.62rem;color:var(--dan);font-weight:700;margin-left:.3rem;">▼${Math.abs(diff)}</span>`;
  }

  function mkRows(arr,sortFn){
    return arr.slice().sort((a,b)=>{ const r=sortFn(a,b); return r!==0?r:(a.no||0)-(b.no||0); });
  }

  function rankSection(key,title,emoji,color,rows,valFn,subFn,emptyMsg,showMore){
    const display=showMore?15:5;
    const prevRanks=saveRanks(key,rows);
    let h=`<div style="background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:.85rem;overflow:hidden;">
      <div style="padding:.75rem 1rem .5rem;border-bottom:1px solid var(--g100);display:flex;align-items:center;gap:.5rem;">
        <span style="font-size:1.4rem;">${emoji}</span>
        <span style="font-weight:700;font-size:.92rem;flex:1;">${title}</span>
        ${rows.length>5?`<button onclick="toggleRankMore('${key}')" class="btn bs bsm" style="font-size:.68rem;padding:.2rem .5rem;">${showMore?'접기':'15위까지 보기'}</button>`:''}
      </div>`;
    if(!rows.length){
      h+=`<div class="empty" style="padding:.85rem;">${emptyMsg}</div></div>`;
      return h;
    }
    const getRank=(arr,idx)=>{
      if(idx===0) return 1;
      const cur=valFn(arr[idx]), prev=valFn(arr[idx-1]);
      return cur===prev ? getRank(arr,idx-1) : idx+1;
    };
    rows.slice(0,display).forEach((r,i)=>{
      const rk=getRank(rows,i);
      const medal=rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':`${rk}`;
      const isMy=isMine(r);
      const delta=rankDelta(prevRanks,r.name,rk);
      h+=`<div ${isTeacher?`onclick="showStudentDetail('${r.name}')" `:''}style="display:flex;align-items:center;gap:.65rem;padding:.5rem 1rem;${isTeacher?'cursor:pointer;':''}
        background:${isMy?'var(--pl)':'transparent'};
        border-left:3px solid ${isMy?color:'transparent'};
        border-bottom:1px solid var(--g100);">
        <div style="min-width:1.6rem;text-align:center;font-size:${rk<=3?'1.1':'0.82'}rem;font-weight:700;">${medal}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${stuEmoji(r.name)} ${r.name}${delta}</div>
          <div style="font-size:.72rem;color:var(--g500);margin-top:.05rem;">${subFn(r)}</div>
        </div>
        <div style="font-size:.85rem;font-weight:700;color:${color};white-space:nowrap;">${valFn(r)}</div>
      </div>`;
    });
    const myIdx=rows.findIndex(r=>isMine(r));
    if(!isTeacher&&myIdx>=display){
      const r=rows[myIdx];
      const myRk=getRank(rows,myIdx);
      const delta=rankDelta(prevRanks,r.name,myRk);
      h+=`<div style="display:flex;align-items:center;gap:.65rem;padding:.5rem 1rem;
        background:var(--pl);border-left:3px solid ${color};border-top:2px dashed var(--g200);">
        <div style="min-width:1.6rem;text-align:center;font-size:.82rem;font-weight:700;">${myRk}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:.85rem;">${stuEmoji(r.name)} ${r.name}${delta} <span style="font-size:.7rem;color:var(--g500);">(내 순위)</span></div>
          <div style="font-size:.72rem;color:var(--g500);">${subFn(r)}</div>
        </div>
        <div style="font-size:.85rem;font-weight:700;color:${color};white-space:nowrap;">${valFn(r)}</div>
      </div>`;
    }
    h+=`</div>`;
    return h;
  }

  const profitRows=mkRows(all.filter(r=>r.inv>0),(a,b)=>b.tpnl-a.tpnl||b.tpct-a.tpct);
  const pctRows=mkRows(all.filter(r=>r.inv>0),(a,b)=>b.tpct-a.tpct||b.tpnl-a.tpnl);
  const donMonthRows=mkRows(all.filter(r=>r.donMonthly>0),(a,b)=>b.donMonthly-a.donMonthly);
  const donYearRows=mkRows(all.filter(r=>r.donYearly>0),(a,b)=>b.donYearly-a.donYearly);
  const emojiRows=mkRows(all.filter(r=>r.iconCount>0),(a,b)=>b.iconCount-a.iconCount);
  const depRows=mkRows(all.filter(r=>r.depTotal>0),(a,b)=>b.depTotal-a.depTotal);

  const resetStr=resetDate?`최근 초기화: ${dStr(new Date(resetDate))}`:'초기화 기록 없음';
  
  // Top 3 포디움
  function podium(rows,label){
    if(rows.length<1) return '';
    const top3=rows.slice(0,3);
    const order=top3.length>=3?[top3[1],top3[0],top3[2]]:(top3.length===2?[top3[1],top3[0]]:[top3[0]]);
    const heights=top3.length>=3?['5rem','6.5rem','4rem']:(top3.length===2?['5rem','6.5rem']:['6.5rem']);
    const medals=['🥈','🥇','🥉'];
    const mIdx=top3.length>=3?[0,1,2]:(top3.length===2?[0,1]:[1]);
    return `<div style="display:flex;justify-content:center;align-items:flex-end;gap:.5rem;margin-bottom:.3rem;">
      ${order.map((r,i)=>{
        const isMy=cu.type==='student'&&r.name===cu.name;
        return `<div style="text-align:center;flex:1;max-width:100px;">
          <div style="font-size:${i===1||(top3.length<3&&i===0)?'2.2rem':'1.6rem'};margin-bottom:.2rem;">${stuEmoji(r.name)}</div>
          <div style="font-size:${i===1||(top3.length<3&&i===0)?'1.3rem':'1rem'};margin-bottom:.15rem;">${medals[mIdx[i]]}</div>
          <div style="background:${isMy?'rgba(96,165,250,.3)':'rgba(255,255,255,.15)'};border-radius:8px 8px 0 0;height:${heights[i]};display:flex;flex-direction:column;justify-content:flex-start;padding-top:.5rem;">
            <div style="font-size:.72rem;font-weight:700;color:white;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .2rem;">${r.name}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  
  let h=`
  <div style="background:linear-gradient(135deg,#1e40af,#7c3aed);border-radius:var(--r);padding:1.2rem 1.2rem .6rem;margin-bottom:.9rem;text-align:center;overflow:hidden;">
    <div style="font-size:1.5rem;margin-bottom:.15rem;">🏆</div>
    <div style="color:white;font-weight:700;font-size:1.05rem;">랭킹</div>
    <div style="color:rgba(255,255,255,.7);font-size:.72rem;margin-top:.1rem;margin-bottom:.8rem;">다이제국 명예의 전당</div>
    ${profitRows.length>0?podium(profitRows,'투자의 신'):''}
    ${isTeacher?`<div style="margin-top:.55rem;display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;">
      <button onclick="resetRanking()" class="btn bsm" style="background:rgba(255,255,255,.2);color:white;font-size:.72rem;padding:.28rem .7rem;">🔄 랭킹 초기화 (이모지 제외)</button>
    </div>
    <div style="color:rgba(255,255,255,.5);font-size:.68rem;margin-top:.3rem;">${resetStr}</div>`:''}
  </div>`;

  h+=rankSection('profit','투자의 신','💰','#0e9f6e',profitRows,
    r=>`${r.tpnl>=0?'+':''}${fE2(r.tpnl)}`,
    r=>`수익률 ${r.tpnl>=0?'+':''}${r.tpct.toFixed(1)}% | 원금 ${fE(r.inv)}`,
    '아직 투자한 학생이 없습니다.',rankShowMore.profit);

  h+=rankSection('pct','수익률의 신','📈','#1d4ed8',pctRows,
    r=>`${r.tpct>=0?'+':''}${r.tpct.toFixed(1)}%`,
    r=>`수익금 ${r.tpnl>=0?'+':''}${fE2(r.tpnl)} | 원금 ${fE(r.inv)}`,
    '아직 투자한 학생이 없습니다.',rankShowMore.pct);

  // 기부 탭 토글 (월간/연간)
  const donTab=rankShowMore.donTab||'month';
  const donRows=donTab==='month'?donMonthRows:donYearRows;
  const donTitle=donTab==='month'?'월간 기부왕':'기부의 신';
  const donEmoji=donTab==='month'?'🎗️':'🌳';
  const donColor=donTab==='month'?'#059669':'#047857';
  const donEmptyMsg=donTab==='month'?'이번 달 기부한 학생이 없습니다.':'올해 기부한 학생이 없습니다.';
  const donSubFn=donTab==='month'
    ?r=>`이번 달 기부 ${fE2(r.donMonthly)}`
    :r=>`올해 누적 기부 ${fE2(r.donYearly)}`;
  const donValFn=donTab==='month'?r=>fE2(r.donMonthly):r=>fE2(r.donYearly);

  // 기부 섹션 (탭 토글 포함)
  const donDisplay=rankShowMore.don?15:5;
  let donH=`<div style="background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:.85rem;overflow:hidden;">
    <div style="padding:.75rem 1rem .4rem;border-bottom:1px solid var(--g100);display:flex;align-items:center;gap:.5rem;">
      <span style="font-size:1.4rem;">${donEmoji}</span>
      <span style="font-weight:700;font-size:.92rem;flex:1;">${donTitle}</span>
      ${donRows.length>5?`<button onclick="toggleRankMore('don')" class="btn bs bsm" style="font-size:.68rem;padding:.2rem .5rem;">${rankShowMore.don?'접기':'15위까지 보기'}</button>`:''}
    </div>
    <div style="display:flex;border-bottom:1px solid var(--g100);">
      <button onclick="window._setDonTab('month')" style="flex:1;padding:.4rem;font-size:.75rem;font-weight:600;border:none;cursor:pointer;background:${donTab==='month'?'var(--primary)':'var(--g50)'};color:${donTab==='month'?'white':'var(--g500)'};">🌙 월간 기부왕</button>
      <button onclick="window._setDonTab('year')" style="flex:1;padding:.4rem;font-size:.75rem;font-weight:600;border:none;cursor:pointer;background:${donTab==='year'?'var(--primary)':'var(--g50)'};color:${donTab==='year'?'white':'var(--g500)'};">🌳 기부의 신</button>
    </div>`;
  if(!donRows.length){
    donH+=`<div class="empty" style="padding:.85rem;">${donEmptyMsg}</div>`;
  } else {
    const getDonRank=(arr,idx)=>{
      if(idx===0) return 1;
      const cur=donValFn(arr[idx]), prev=donValFn(arr[idx-1]);
      return cur===prev ? getDonRank(arr,idx-1) : idx+1;
    };
    donRows.slice(0,donDisplay).forEach((r,i)=>{
      const rk=getDonRank(donRows,i);
      const medal=rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':`${rk}`;
      const isMy=isMine(r);
      donH+=`<div style="display:flex;align-items:center;gap:.65rem;padding:.5rem 1rem;
        background:${isMy?'var(--pl)':'transparent'};
        border-left:3px solid ${isMy?donColor:'transparent'};
        border-bottom:1px solid var(--g100);">
        <div style="min-width:1.6rem;text-align:center;font-size:${rk<=3?'1.1':'0.82'}rem;font-weight:700;">${medal}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${stuEmoji(r.name)} ${r.name}</div>
          <div style="font-size:.72rem;color:var(--g500);margin-top:.05rem;">${donSubFn(r)}</div>
        </div>
        <div style="font-size:.85rem;font-weight:700;color:${donColor};white-space:nowrap;">${donValFn(r)}</div>
      </div>`;
    });
    const myIdx=donRows.findIndex(r=>isMine(r));
    if(!isTeacher&&myIdx>=donDisplay){
      const r=donRows[myIdx];
      const myRk=getDonRank(donRows,myIdx);
      donH+=`<div style="display:flex;align-items:center;gap:.65rem;padding:.5rem 1rem;
        background:var(--pl);border-left:3px solid ${donColor};border-top:2px dashed var(--g200);">
        <div style="min-width:1.6rem;text-align:center;font-size:.82rem;font-weight:700;">${myRk}</div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:.85rem;">${stuEmoji(r.name)} ${r.name} <span style="font-size:.7rem;color:var(--g500);">(내 순위)</span></div>
          <div style="font-size:.72rem;color:var(--g500);">${donSubFn(r)}</div>
        </div>
        <div style="font-size:.85rem;font-weight:700;color:${donColor};white-space:nowrap;">${donValFn(r)}</div>
      </div>`;
    }
  }
  donH+=`</div>`;
  h+=donH;

  h+=rankSection('emoji','이모지 마스터','🎨','#7c3aed',emojiRows,
    r=>`${r.iconCount}개`,
    r=>`이모지 ${r.iconCount}개 보유`,
    '아직 이모지를 구매한 학생이 없습니다.',false);

  h+=rankSection('dep','저축의 신','🏦','#b45309',depRows,
    r=>fE(r.depTotal),
    r=>`예금 중 ${fE(r.depTotal)}`,
    '아직 예금한 학생이 없습니다.',rankShowMore.dep);

  el.innerHTML=h;
}

function checkMonthlyRankReset(){
  if(!state) return;
  const now=kst();
  const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  if(now.getDate()===lastDay){
    const todayStr=now.toDateString();
    if(state._lastAutoReset!==todayStr){
      state._lastAutoReset=todayStr;
      state.rankResetDate=now.toISOString();
      ss();

  return out;
}

function todayPostCount(name){
  const today=dStr();
  return (state.board||[]).filter(p=>p.author===name&&p.date===today).length;
}
function todayCommentCount(name){
  const today=dStr();
  let cnt=0;
  (state.board||[]).forEach(p=>(p.comments||[]).forEach(c=>{if(c.author===name&&c.date===today)cnt++;}));
  return cnt;
}

let boardView=null; // null=목록, id=상세
window.__boardView=null;
Object.defineProperty(window,'boardView',{
  get:()=>boardView,
  set:(v)=>{boardView=v;}
});

function rBoard(el){
  if(boardView) {rBoardDetail(el,boardView);return;}
  const posts=(state.board||[]);
  let h=`<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;">
    <div class="ct" style="margin-bottom:0;">📌 다이제 게시판</div>
    <button class="btn bp bsm" onclick="showBoardWrite()">✏️ 글쓰기</button>
  </div>`;
  if(!posts.length){h+=`<div class="card"><div class="empty">아직 게시글이 없습니다. 첫 글을 써보세요!</div></div>`;}
  else{
    h+=`<div class="card" style="padding:.5rem;">`;
    posts.forEach(p=>{
      const canDel=cu.type==='teacher'||cu.name===p.author;
      h+=`<div style="padding:.8rem;border-bottom:1px solid var(--g200);display:flex;gap:.75rem;align-items:flex-start;">
        <div style="flex:1;cursor:pointer;" onclick="boardView='${p.id}';switchTab('board')">
          <div style="font-weight:600;font-size:.9rem;margin-bottom:.2rem;">${stuEmoji(p.author)} ${filterBad(p.title)}</div>
          <div class="txs tg">${p.author} · ${p.date} · 댓글 ${(p.comments||[]).length}${(p.likes||[]).length?` · ❤️ ${(p.likes||[]).length}`:''}</div>
        </div>
        ${p.image?`<div style="width:52px;height:52px;border-radius:8px;overflow:hidden;flex-shrink:0;cursor:pointer;" onclick="boardView='${p.id}';switchTab('board')"><img src="${p.image}" style="width:100%;height:100%;object-fit:cover;"/></div>`:''}
        ${canDel?`<button class="btn bdan bsm" onclick="deletePost('${p.id}')" style="flex-shrink:0;">삭제</button>`:''}
      </div>`;
    });
    h+=`</div>`;
  }
  el.innerHTML=h;
}

function rBoardDetail(el,pid){
  const post=(state.board||[]).find(p=>p.id===pid);

  const canDelete=cu.type==='teacher'||cu.name===post.author;
  let h=`<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;">
    <button class="btn bs bsm" onclick="boardView=null;switchTab('board')">← 목록</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.65rem;">
      <div>
        <div style="font-weight:700;font-size:1rem;">${filterBad(post.title)}</div>
        <div class="txs tg" style="margin-top:.2rem;">${post.author} · ${post.date}${post.edited?' · <span style="color:var(--primary);">수정됨</span>':''}</div>
      </div>
      <div style="display:flex;gap:.3rem;">
        ${cu.name===post.author?`<button class="btn bs bsm" onclick="editPost('${pid}')">✏️ 수정</button>`:''}

        ${(post.likes||[]).includes(cu.name)?'❤️':'🤍'} ${(post.likes||[]).length||''}
      </button>
      <span class="txs tg">${(post.likes||[]).length>0?(post.likes||[]).map(n=>stuEmoji(n)).join(' '):''}</span>
    </div>
  </div>
  <div class="card"><div class="ct">💬 댓글 ${(post.comments||[]).length}개</div>`;

  (post.comments||[]).forEach((c,i)=>{
    const canDel=cu.type==='teacher'||cu.name===c.author;
    h+=`<div style="padding:.6rem 0;border-bottom:1px solid var(--g200);display:flex;gap:.5rem;align-items:flex-start;">
      <div style="flex:1;">
        <span style="font-weight:600;font-size:.82rem;">${c.author}</span>

  h+=`<div style="margin-top:.75rem;">
    <div class="txs tg" style="margin-bottom:.35rem;">오늘 남은 댓글 ${Math.max(0,commentLeft)}개</div>
    <div style="display:flex;gap:.45rem;">
      <input type="text" id="commentInput" placeholder="댓글 입력..." ${commentLeft<=0?'disabled':''} style="flex:1;padding:.52rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.88rem;font-family:inherit;"/>
      <button class="btn bp bsm" onclick="addComment('${pid}')" ${commentLeft<=0?'disabled':''}>등록</button>
    </div>
  </div></div>`;

function showBoardWrite(){
  const left=3-todayPostCount(cu.name);
  if(left<=0){showToast('오늘 작성 가능한 글 수(3개)를 초과했습니다.');return;}
  openModal('글쓰기',`
    <div class="fg"><label>제목</label><input type="text" id="bTitle" placeholder="제목 입력" style="width:100%;padding:.55rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.9rem;font-family:inherit;"/></div>
    <div class="fg"><label>내용</label><textarea id="bContent" rows="4" placeholder="내용 입력" style="width:100%;padding:.55rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.88rem;font-family:inherit;resize:vertical;"></textarea></div>
    <div class="fg"><label>사진 첨부 (선택)</label><input type="file" id="bImage" accept="image/*" style="font-size:.82rem;"/></div>
    <div class="txs tg">오늘 남은 글 수: ${left}개</div>
  `,[
    {l:'등록',c:'bp',f:async()=>{
      const title=document.getElementById('bTitle').value.trim();
      const content=document.getElementById('bContent').value.trim();
      const imgFile=document.getElementById('bImage').files[0];
      if(!title||!content){showToast('제목과 내용을 입력해주세요.');return;}
      let imgData='';
      if(imgFile){
        imgData=await resizeImage(imgFile);
      }
      if(!state.board) state.board=[];
      state.board.unshift({id:'p'+Date.now(),title,content,author:cu.name,date:dStr(),image:imgData,comments:[]});
      ss();showToast('게시글이 등록되었습니다!');closeModal();
      boardView=null;rBoard(document.getElementById('tab-board'));
    }},
    {l:'취소',c:'bs',f:closeModal}
  ]);
}

function addComment(pid){
  const txt=document.getElementById('commentInput').value.trim();
  if(!txt){showToast('댓글 내용을 입력해주세요.');return;}
  if(todayCommentCount(cu.name)>=10){showToast('오늘 댓글 한도(10개)를 초과했습니다.');return;}
  const post=(state.board||[]).find(p=>p.id===pid);
  if(!post) return;
  if(!post.comments) post.comments=[];
  post.comments.push({text:txt,author:cu.name,date:dStr(),ts:new Date().toISOString()});
  ss();switchTab('board');
}

function editPost(pid){
  const post=(state.board||[]).find(p=>p.id===pid);
  if(!post||post.author!==cu.name){showToast('수정 권한이 없습니다.');return;}
  openModal('✏️ 게시글 수정',`
    <div class="fg"><label>제목</label><input type="text" id="editBTitle" value="${escHtml(post.title)}" style="width:100%;padding:.55rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.9rem;font-family:inherit;background:var(--card);color:var(--g900);"/></div>
    <div class="fg"><label>내용</label><textarea id="editBContent" rows="4" style="width:100%;padding:.55rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.88rem;font-family:inherit;resize:vertical;background:var(--card);color:var(--g900);">${escHtml(post.content)}</textarea></div>
  `,[
    {l:'저장',c:'bp',f:()=>{
      const t=document.getElementById('editBTitle').value.trim();
      const c=document.getElementById('editBContent').value.trim();
      if(!t||!c){showToast('제목과 내용을 입력해주세요.');return;}
      post.title=t;post.content=c;post.edited=true;
      ss();closeModal();showToast('게시글이 수정됐어요!');
      boardView=pid;switchTab('board');
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}

function toggleLike(pid){
  const post=(state.board||[]).find(p=>p.id===pid);
  if(!post) return;
  if(!post.likes) post.likes=[];
  const idx=post.likes.indexOf(cu.name);
  if(idx>=0) post.likes.splice(idx,1);
  else post.likes.push(cu.name);
  ss();switchTab('board');
}

function deletePost(pid){
  openModal('게시글 삭제',`<p class="tsm">이 게시글을 삭제합니다.</p>`,[
    {l:'삭제',c:'bdan',f:()=>{
      state.board=(state.board||[]).filter(p=>p.id!==pid);
      ss();closeModal();boardView=null;switchTab('board');
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}

function deleteComment(pid,idx){
  const post=(state.board||[]).find(p=>p.id===pid);
  if(!post) return;
  post.comments.splice(idx,1);
  ss();switchTab('board');
}

// 이미지 확대 보기
function zoomImg(e,hid,type,name){
  if(e&&e.stopPropagation) e.stopPropagation();
  const hw=(state.homework||[]).find(a=>a.id===hid);
  if(!hw) return;
  let src='',title='';
  if(type==='hw'){src=hw.image;title=hw.title;}
  else{const sub=(hw.submissions||{})[name];if(!sub)return;src=sub.image;title=`${name}의 제출물`;}
  if(!src) return;
  // 풀스크린 오버레이
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;cursor:pointer;';
  overlay.innerHTML=`
    <div style="color:white;font-size:.88rem;font-weight:600;margin-bottom:.6rem;text-align:center;">${escHtml(title)}</div>
    <img src="${src}" style="max-width:95vw;max-height:85vh;object-fit:contain;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);"/>
    <div style="color:rgba(255,255,255,.6);font-size:.75rem;margin-top:.7rem;">탭하면 닫힘</div>`;
  overlay.onclick=()=>overlay.remove();
  document.body.appendChild(overlay);
}

// ── DONATION (기부)
function rDonation(el){
  const goals=(state.donationGoals||[]).slice().sort((a,b)=>a.amount-b.amount);
  const total=state.totalDonation||0;
  const maxGoal=goals.length>0?goals[goals.length-1].amount:2000;
  const pct=Math.min(100,(total/maxGoal)*100);

  // 나무 성장 단계 계산
  function treeStage(pct){
    if(pct<5)  return{emoji:'🌱',label:'씨앗',color:'#84cc16'};
    if(pct<20) return{emoji:'🌿',label:'새싹',color:'#22c55e'};
    if(pct<40) return{emoji:'🌳',label:'작은 나무',color:'#16a34a'};
    if(pct<65) return{emoji:'🌲',label:'큰 나무',color:'#15803d'};
    if(pct<85) return{emoji:'🌸',label:'꽃 피는 나무',color:'#ec4899'};
    return{emoji:'✨🌟🌳🌟✨',label:'황금 나무',color:'#d97706'};
  }
  const stage=treeStage(pct);
  const isTeacher=cu.type==='teacher';
  const st=state.students[cu.name];
  const myBal=isTeacher?0:(st?.bal||0);

  let h=`
  <!-- 나무 UI -->
  <div style="background:linear-gradient(180deg,var(--pl) 0%,var(--sl) 60%,var(--sl) 100%);border-radius:var(--r);padding:1.5rem 1.2rem;text-align:center;box-shadow:var(--sh);margin-bottom:.9rem;">
    <div id="donationTree" style="font-size:4.5rem;margin-bottom:.4rem;transition:all .5s;">${stage.emoji}</div>
    <div style="font-weight:700;font-size:1rem;color:${stage.color};margin-bottom:.25rem;">${stage.label}</div>
    <div style="font-size:.82rem;color:var(--g700);margin-bottom:1rem;">우리 반 나무 · 누적 기부 <strong style="color:${stage.color};">${fE2(total)}</strong></div>
    <!-- 프로그레스 바 -->
    <div style="background:var(--g200);border-radius:999px;height:18px;overflow:hidden;margin-bottom:.5rem;position:relative;">
      <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--suc),${stage.color});border-radius:999px;transition:width .8s;min-width:${pct>0?'4px':'0'};"></div>
    </div>
    <div style="font-size:.75rem;color:var(--g500);">${pct.toFixed(1)}% 달성</div>
  </div>

  <!-- 목표/보상 목록 -->
  <div class="card"><div class="ct">🎁 기부 보상 목록</div>`;

  goals.forEach(g=>{
    const unlocked=total>=g.amount;
    const gPct=Math.min(100,(total/g.amount)*100);
    h+=`<div style="display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--g200);">
      <div style="font-size:1.6rem;opacity:${unlocked?1:.35};">🎁</div>
      <div style="flex:1;">
        <div style="font-size:.88rem;font-weight:600;color:${unlocked?'var(--suc)':'var(--g700)'};">${g.reward}</div>
        <div style="font-size:.72rem;color:var(--g500);margin-top:.1rem;">목표: ${fE2(g.amount)}</div>
        <div style="background:var(--g200);border-radius:999px;height:6px;margin-top:.3rem;overflow:hidden;">
          <div style="width:${gPct}%;height:100%;background:${unlocked?'var(--suc)':'var(--primary)'};border-radius:999px;"></div>
        </div>
      </div>
      <div style="font-size:.85rem;font-weight:700;color:${unlocked?'var(--suc)':'var(--g500)'};">${unlocked?'✅ 해금':'🔒'}</div>
    </div>`;
  });
  h+=`</div>`;

  // 기부하기 (학생만)
  if(!isTeacher){
    h+=`<div class="card"><div class="ct">💚 기부하기</div>
    <p class="tsm tg" style="margin-bottom:.65rem;">내 유로를 반 나무에 기부해요. 기부금은 반환되지 않습니다.</p>
    <p class="tsm" style="margin-bottom:.6rem;">내 투자 가능 금액: <strong class="tp">${fE2(myBal)}</strong></p>
    <div style="display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.5rem;">
      ${[10,50,100,500].map(a=>`<button class="btn bs bsm" onclick="donateAmount(${a})" ${myBal<a?'disabled':''}>+${a}유로</button>`).join('')}
    </div>
    <div style="display:flex;gap:.45rem;align-items:flex-end;">
      <div class="fg" style="flex:1;margin-bottom:0;"><label>직접 입력 (소수점 둘째자리까지)</label>
        <input type="number" id="donateInput" min="0.01" step="0.01" placeholder="예: 12.50" style="width:100%;padding:.55rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.92rem;font-family:inherit;"/>
      </div>
      <button class="btn bsuc bsm" onclick="donateCustom()">기부</button>
    </div></div>`;
  }

  // 기부 기록
  const donLog=(state.donationLog||[]);
  if(donLog.length>0){
    const showAllDon=!!(state._showAllDonLog);
    const displayLog=showAllDon?donLog:donLog.slice(0,10);
    h+=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;">
      <div class="ct" style="margin-bottom:0;">📋 기부 내역 (총 ${donLog.length}건)</div>
      ${donLog.length>10?`<button onclick="toggleDonLog()" class="btn bs bsm" style="font-size:.7rem;">${showAllDon?'접기':'전체 보기'}</button>`:''}
    </div>`;
    displayLog.forEach(d=>{
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--g200);font-size:.83rem;">
        <span>${stuEmoji(d.name)} ${d.name}</span>
        <span class="tsuc fb">+${fE2(d.amount)}</span>
        <span class="txs tg">${d.date}</span>
      </div>`;
    });
    if(!showAllDon&&donLog.length>10){
      h+=`<div style="text-align:center;padding:.45rem 0;font-size:.75rem;color:var(--g500);">... 외 ${donLog.length-10}건</div>`;
    }
    h+=`</div>`;
  }
  el.innerHTML=h;
}

function donateAmount(amt){
  const st=state.students[cu.name];
  if((st.bal||0)<amt){showToast('잔액이 부족합니다.');return;}
  confirmDonate(amt);
}

function toggleDonLog(){
  state._showAllDonLog=!state._showAllDonLog;
  switchTab('donation');
}

function donateCustom(){
  const raw=parseFloat(document.getElementById('donateInput')?.value);
  if(!raw||raw<=0){showToast('금액을 입력해주세요.');return;}
  // 소수점 둘째자리까지만
  const v=Math.floor(raw*100)/100;
  if(v<=0){showToast('0.01유로 이상 입력해주세요.');return;}
  const st=state.students[cu.name];
  if((st.bal||0)<v){showToast('잔액이 부족합니다.');return;}
  confirmDonate(v);
}

function confirmDonate(amt){
  const rounded=parseFloat(amt.toFixed(2));
  openModal('💚 기부 확인',`
    <div style="text-align:center;padding:.5rem 0;">
      <div style="font-size:2.5rem;margin-bottom:.5rem;">🌳</div>
      <div style="font-size:1.1rem;font-weight:700;color:var(--suc);margin-bottom:.3rem;">${fE2(rounded)}</div>
      <div style="font-size:.88rem;color:var(--g700);">를 우리 반 나무에 기부합니다.<br/>기부금은 반환되지 않습니다.</div>
    </div>
  `,[
    {l:'💚 기부하기',c:'bsuc',f:()=>{closeModal();processDonate(rounded);}},
    {l:'취소',c:'bs',f:closeModal}
  ]);
}

function processDonate(amt){
  const st=state.students[cu.name];
  const rounded=parseFloat(amt.toFixed(2));
  st.bal=parseFloat((st.bal-rounded).toFixed(2));
  st.iconSpent=(st.iconSpent||0)+rounded;
  state.totalDonation=parseFloat(((state.totalDonation||0)+rounded).toFixed(2));
  if(!state.donationLog) state.donationLog=[];
  else if(!Array.isArray(state.donationLog)) state.donationLog=Object.values(state.donationLog).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const entry={name:cu.name,amount:rounded,date:dStr(),ts:new Date().toISOString()};
  state.donationLog.unshift(entry);
  if(state.donationLog.length>200) state.donationLog=state.donationLog.slice(0,200);
  // 즉시 전체 저장 (딜레이 없음)
  ssNow();
  playSound('buy');
  showToast(`💚 ${fE2(rounded)} 기부 완료! 고마워요!`);
  const donEl=document.getElementById('tab-donation');
  if(donEl&&donEl.classList.contains('active')) rDonation(donEl);
  else switchTab('donation');
  // 나무 흔들림 애니메이션
  setTimeout(()=>{
    const tree=document.getElementById('donationTree');
    if(tree){tree.classList.add('tree-shake');setTimeout(()=>tree.classList.remove('tree-shake'),900);}
  },100);
}

function addPatrolLog(){
  const checked=[...patrolChecked];
  const content=patrolFormState.content.trim();
  const score=patrolFormState.score;
  const dateInput=patrolFormState.date;
  if(!checked.length){showToast('대상 학생을 1명 이상 선택해주세요.');return;}

  const now=kst();
  const date=dateInput||`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  if(!state.patrolLog) state.patrolLog=[];

function deletePatrolLog(idx){
  const filtered=getPatrolFiltered();
  const item=filtered[idx];
  if(!item) return;
  const realIdx=state.patrolLog.findIndex(l=>l.ts===item.ts);
  if(realIdx===-1) return;
  openModal('삭제 확인',`<p class="tsm"><strong>${item.target}</strong> - ${item.content} 기록을 삭제합니다.</p>`,[
    {l:'삭제',c:'bdan',f:()=>{
      state.patrolLog.splice(realIdx,1);
      ss();closeModal();rPatrol(document.getElementById('tab-patrol'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}

function getPatrolFiltered(){
  return (state.patrolLog||[]).filter(l=>{
    const [y,m]=l.date.split('-');
    if(patrolFilter.year&&y!==patrolFilter.year) return false;
    if(patrolFilter.month&&m!==patrolFilter.month) return false;
    if(patrolFilter.student&&l.target!==patrolFilter.student) return false;
    return true;
  });
}

// ── IMAGE RESIZE HELPER (Firebase 용량 절약)
function resizeImage(file,maxW=800,quality=0.7){
  return new Promise(resolve=>{
    const fr=new FileReader();
    fr.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*(maxW/w));w=maxW;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>resolve(e.target.result); // 실패 시 원본
      img.src=e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

// ── SOUND EFFECTS (Web Audio API)
function playSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='buy'){
      o.frequency.setValueAtTime(440,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.15);
      g.gain.setValueAtTime(0.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
      o.start();o.stop(ctx.currentTime+0.3);
    } else if(type==='sell'){
      o.frequency.setValueAtTime(880,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+0.15);
      g.gain.setValueAtTime(0.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
      o.start();o.stop(ctx.currentTime+0.3);
    } else if(type==='deposit'){
      // 동전 소리 느낌
      o.frequency.setValueAtTime(1200,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(600,ctx.currentTime+0.08);
      g.gain.setValueAtTime(0.2,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
      o.start();o.stop(ctx.currentTime+0.2);
    } else if(type==='win'){
      // 복권 당첨 팡파레 — 4음 상승 (기본 오실레이터 사용 안 함)
      g.gain.setValueAtTime(0,ctx.currentTime); // 기본 오실레이터 음소거
      o.start();o.stop(ctx.currentTime+0.01);
      const freqs=[523,659,784,1047];
      freqs.forEach((f,i)=>{
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.frequency.setValueAtTime(f,ctx.currentTime+i*0.13);
        g2.gain.setValueAtTime(0.35,ctx.currentTime+i*0.13);
        g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.13+0.28);
        o2.start(ctx.currentTime+i*0.13);
        o2.stop(ctx.currentTime+i*0.13+0.28);
      });
    }
  }catch(e){}
}

function appC(id){
  const req=state.pd.find(r=>r.id===id);if(!req)return;
  const st=state.students[req.to];
  if(req.type==='deposit'){
    st.bal=parseFloat((st.bal+req.amt).toFixed(2));st.dep0=(st.dep0||0)+req.amt;
    addTxLog('deposit',req.to,req.amt,cu.name,'요청 승인');
  } else {
    const amt=parseFloat(req.amt.toFixed?req.amt.toFixed(2):req.amt);
    if(st.bal<amt){showToast('투자 가능 금액 부족');return;}
    st.bal=parseFloat((st.bal-amt).toFixed(2));st.dep0=Math.max(0,(st.dep0||0)-amt);
    addTxLog('withdraw',req.to,amt,cu.name,'요청 승인');
  }
  req.st='approved';ss();showToast(`${req.to} ${req.type==='deposit'?'입금':'출금'} 승인!`);
  rCashier(document.getElementById('tab-cashier'));
}
function rejC(id){
  const req=state.pd.find(r=>r.id===id);if(!req)return;
  addTxLog('reject',req.to,req.amt,cu.name,'요청 거절');

function csDir(type){
  const name=selectedCashierStu||document.getElementById('csStu')?.value;
  if(!name){showToast('학생을 먼저 선택해주세요.');return;}
  const raw=parseFloat(document.getElementById('csAmt').value);
  if(!raw||raw<=0){showToast('금액을 입력해주세요.');return;}
  const st=state.students[name];
  if(!st){showToast('학생 정보를 찾을 수 없습니다.');return;}

  if(type==='deposit'){
    const newBal=parseFloat((st.bal+raw).toFixed(2));
    const newDep0=(st.dep0||0)+raw;
    st.bal=newBal; st.dep0=newDep0;
    addTxLog('deposit',name,raw,cu.name,'직접 입금');
    // 잔액만 부분 업데이트 (race condition 방지)
    update(ref(db,ROOT+'/students/'+name),{bal:newBal,dep0:newDep0}).catch(()=>{});
    ssNow();
    showToast(`${name}에게 ${fE(raw)} 입금 완료!`);
  } else {
    const amt=parseFloat(raw.toFixed(2));
    if(st.bal<amt){showToast('잔액이 부족합니다.');return;}
    const newBal=parseFloat((st.bal-amt).toFixed(2));
    const newDep0=Math.max(0,(st.dep0||0)-amt);
    st.bal=newBal; st.dep0=newDep0;
    addTxLog('withdraw',name,amt,cu.name,'직접 출금');
    update(ref(db,ROOT+'/students/'+name),{bal:newBal,dep0:newDep0}).catch(()=>{});
    ssNow();
    showToast(`${name}에서 ${fE(amt)} 출금 완료!`);
  }
  // 선택 유지하며 금액 초기화
  setTimeout(()=>{ document.getElementById('csAmt')?.focus(); },50);
}

function cashierBulkWithdraw(){
  const raw=parseFloat(document.getElementById('csBulkAmt').value);
  if(!raw||raw<=0){showToast('금액을 입력해주세요.');return;}
  const amt=Math.round(raw);
  openModal('일괄 회수 확인',`<p class="tsm">투자 기록이 있는 학생 전원에게서 1인당 <strong>${fE(amt)}</strong>를 회수합니다.</p>`,[
    {l:'회수',c:'bdan',f:()=>{
      let cnt=0,skip=0;
      STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
        const st=state.students[s.name];
        if(!st||(st.dep0||0)===0) return;
        if(st.bal<amt){skip++;return;}
        st.bal=parseFloat((st.bal-amt).toFixed(2));
        st.dep0=Math.max(0,(st.dep0||0)-amt);
        addTxLog('withdraw',s.name,amt,cu.name,'일괄 회수(은행장)');
        cnt++;
      });
      ss();showToast(`${cnt}명 회수 완료${skip>0?` (잔액부족 ${skip}명 제외)`:''}`);closeModal();
      rCashier(document.getElementById('tab-cashier'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}

function tchNews(){
  if(isWE()){showToast('주말에는 뉴스를 발행할 수 없습니다.');return;}
  const dateStr=kst().toDateString();
  const todayNews=[];
  STOCKS.forEach(s=>{
    const sel=document.getElementById('nS-'+s.id);
    const idx=sel?.value,pool=NP[s.id];
    const ni=idx!==''&&idx!=null?pool[parseInt(idx)]:pool[Math.floor(Math.random()*pool.length)];
    todayNews.push({sid:s.id,t:ni.t,p:ni.p});
    state.news.unshift({
      sid:s.id,t:ni.t,p:ni.p,
      date:dStr(),price:state.stocks[s.id].price,prev:state.stocks[s.id].price,
      chg:'0.00',time:'수동',isBreaking:true
    });
  });
  state.todayNews={date:dateStr,items:todayNews};
  // 시세도 즉시 변동
  state.lastHour=null;
  runMarket();
  if(state.news.length>100) state.news=state.news.slice(0,100);
  ss();showToast('📰 뉴스 발행 + 시세 변동 완료!');rTeacher(document.getElementById('tab-teacher'));
}

  const withdrawAmt=Math.round(amt);

    {l:'회수',c:'bdan',f:()=>{
      let cnt=0,skip=0;
      STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
        const st=state.students[s.name];
        if(!st||(st.dep0||0)===0) return;
        if(st.bal<withdrawAmt){skip++;return;}
        st.bal=parseFloat((st.bal-withdrawAmt).toFixed(2));
        st.dep0=Math.max(0,(st.dep0||0)-withdrawAmt);
        addTxLog('withdraw',s.name,withdrawAmt,cu.name,'일괄 회수');
        cnt++;
      });
      ss();showToast(`${cnt}명 회수 완료${skip>0?` (잔액부족 ${skip}명 제외)`:''}`);closeModal();
      rTeacher(document.getElementById('tab-teacher'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
