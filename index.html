<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>DAIZE 시스템 (이모지+지도)</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:20px}
.map-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tile{aspect-ratio:1;border-radius:10px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;position:relative;transition:.2s}
.tile:hover{transform:scale(1.1)}
.tile.mine{background:#cfe3ff;outline:2px solid #1a56db}
.building{position:absolute;bottom:3px;right:4px;font-size:.8rem}
</style>
</head>
<body>

<h2>지도</h2>
<div id="map" class="map-grid"></div>

<script>
const state = {
  students:{
    "김승언":{emoji:{equipped:"🔥"}},
    "박유성":{emoji:{equipped:"🐶"}}
  },
  realEstateMap:{}
};

const currentUser = "김승언";

function renderMap(){
  const el = document.getElementById("map");
  el.innerHTML="";

  for(let i=1;i<=36;i++){
    const id="tile_"+i;
    const tile=state.realEstateMap[id];

    const div=document.createElement("div");
    div.className="tile";

    if(tile?.owner){
      const emoji=state.students[tile.owner]?.emoji?.equipped||"🙂";
      div.textContent=emoji;

      if(tile.owner===currentUser) div.classList.add("mine");

      if(tile.building){
        const b=document.createElement("div");
        b.className="building";
        b.textContent = tile.building==="apartment"?"🏢":
                        tile.building==="shop"?"🏪":"🏭";
        div.appendChild(b);
      }

    }else{
      div.textContent="➕";
    }

    div.onclick=()=>onTileClick(id,tile);
    el.appendChild(div);
  }
}

function onTileClick(id,tile){
  if(!tile){
    state.realEstateMap[id]={owner:currentUser,building:null};
  }else if(tile.owner===currentUser){
    tile.building="apartment";
  }else{
    alert("다른 사람 땅");
  }
  renderMap();
}

renderMap();
</script>

</body>
</html>
